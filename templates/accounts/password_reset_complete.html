{% extends 'base.html' %}

{% block title %}Password Reset Successful | CareerConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card p-5 shadow-sm border-0">
                <i class="bi bi-check-circle text-success display-3 mb-3"></i>
                <h3 class="fw-bold mb-2">Password Successfully Reset</h3>
                <p class="text-secondary mb-4">
                    Your password has been changed. You may now proceed to log in with your new credentials.
                </p>
                <div>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary px-5 py-2 rounded-pill fw-semibold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
