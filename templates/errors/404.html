{% extends 'base.html' %}

{% block title %}404 Not Found | CareerConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-0">
                <i class="bi bi-question-circle text-warning display-1 mb-3"></i>
                <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
                <p class="text-secondary mb-4">
                    The job listing, company profile, or URL you are looking for does not exist or may have been removed.
                </p>
                <div>
                    <a href="{% url 'jobs:job_list' %}" class="btn btn-primary px-4 rounded-pill">Explore Open Jobs</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
