{% extends 'base.html' %}

{% block title %}500 Server Error | CareerConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-0">
                <i class="bi bi-exclamation-octagon text-danger display-1 mb-3"></i>
                <h2 class="fw-bold mb-2">500 - Internal Server Error</h2>
                <p class="text-secondary mb-4">
                    An unexpected server error occurred. Our engineers have been alerted. Please try again shortly.
                </p>
                <div>
                    <a href="{% url 'jobs:home' %}" class="btn btn-primary px-4 rounded-pill">Return to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
